<!DOCTYPE busconfig PUBLIC
 "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <!-- Only root can own the service -->
  <policy user="root">
    <allow own="org.deepin.Anything"/>
    <allow send_destination="org.deepin.Anything"/>
  </policy>

  <!-- deepin-daemon group can call all methods -->
  <policy group="deepin-daemon">
    <allow send_destination="org.deepin.Anything"
           send_interface="org.deepin.Anything"/>
  </policy>

  <!-- Default: deny SetAllowCaller, allow GetEventChannel -->
  <policy context="default">
    <deny send_destination="org.deepin.Anything"
          send_interface="org.deepin.Anything"
          send_member="SetAllowCaller"/>
    <allow send_destination="org.deepin.Anything"
           send_interface="org.deepin.Anything"
           send_member="GetEventChannel"/>
  </policy>
</busconfig>
